name: Validate GitHub Pages and Cloudflare Worker

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-candidates:
    name: Build production pages without publishing
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate through the shared pipeline
        uses: ./.github/actions/build-site
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
      - name: Save reviewable acquisition and quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-quality-preview
          path: |
            quality-report.json
            site/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: python -m pip install --quiet -r requirements-render.txt

      - name: Test sale quantity parsing
        run: python -m unittest discover -s tests -v

      - name: Validate Pages build scripts
        run: python -m compileall -q scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate production Cloudflare Worker
        run: node --check cloudflare-api/src/safe-index.js

      - name: Test analytics attribution and operator mode
        run: npm ci --ignore-scripts && npm test

      - name: Verify production platform references
        run: |
          test "$(python - <<'PY'
          from pathlib import Path

          roots = (Path('.github'), Path('scripts'), Path('cloudflare-api'))
          matches = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.js', '.yml', '.yaml', '.json', '.jsonc', '.toml'}:
                      if path == Path('.github/workflows/validate-pr.yml'):
                          continue
                      if ('net' + 'lify') in path.read_text(encoding='utf-8').lower():
                          matches.append(str(path))
          print('\n'.join(matches))
          PY
          )" = ""
          test "$(python - <<'PY'
          from pathlib import Path

          text = Path('scripts/enable_realtime_search.py').read_text(encoding='utf-8')
          print('ok' if '.workers.dev/api/product-search' in text else '')
          PY
          )" = "ok"
