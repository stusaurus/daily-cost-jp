name: Validate GitHub Pages and Cloudflare Worker

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-candidates:
    name: Build production pages without publishing
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate through the shared pipeline
        uses: ./.github/actions/build-site
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
      - name: Verify search landing pages in desktop and mobile browsers
        run: |
          npx playwright install --with-deps chromium
          node scripts/check_search_conversion.cjs
      - name: Audit generated mobile and desktop layouts with Lighthouse
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/daily-lab-web lighthouse-reports
          ln -s "$GITHUB_WORKSPACE/site" /tmp/daily-lab-web/daily-cost-jp
          python -m http.server 8765 --directory /tmp/daily-lab-web > /tmp/daily-lab-http.log 2>&1 &
          audit_server_pid=$!
          trap 'kill "$audit_server_pid"' EXIT
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/?test=1' --chrome-flags='--headless' --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/home-mobile --quiet
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/categories/tissue/?test=1' --chrome-flags='--headless' --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/tissue-mobile --quiet
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/today/?test=1' --chrome-flags='--headless' --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/today-desktop --quiet
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/?test=1' --chrome-flags='--headless' --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/home-desktop --quiet
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/today/?test=1' --chrome-flags='--headless' --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/today-mobile --quiet
          npm exec --yes --package=lighthouse@12.8.2 -- lighthouse 'http://127.0.0.1:8765/daily-cost-jp/categories/?test=1' --chrome-flags='--headless' --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path=lighthouse-reports/categories-desktop --quiet
      - name: Save reviewable acquisition and quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-quality-preview
          path: |
            quality-report.json
            lighthouse-reports/
            qa-search/
            site/
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rendering dependencies
        run: python -m pip install --quiet -r requirements-render.txt

      - name: Test sale quantity parsing
        run: python -m unittest discover -s tests -v

      - name: Validate Pages build scripts
        run: python -m compileall -q scripts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate production Cloudflare Worker
        run: node --check cloudflare-api/src/safe-index.js

      - name: Test analytics attribution and operator mode
        run: npm ci --ignore-scripts && npm test

      - name: Verify production platform references
        run: |
          test "$(python - <<'PY'
          from pathlib import Path

          roots = (Path('.github'), Path('scripts'), Path('cloudflare-api'))
          matches = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.js', '.yml', '.yaml', '.json', '.jsonc', '.toml'}:
                      if path == Path('.github/workflows/validate-pr.yml'):
                          continue
                      text = path.read_text(encoding='utf-8').lower()
                      # Only this fixed opt-out marker is permitted in the docs-only publisher.
                      if path == Path('scripts/autonomous_operations_step2.py'):
                          text = text.replace('[skip ' + 'net' + 'lify]', '')
                      if ('net' + 'lify') in text:
                          matches.append(str(path))
          print('\n'.join(matches))
          PY
          )" = ""
          test "$(python - <<'PY'
          from pathlib import Path

          text = Path('scripts/enable_realtime_search.py').read_text(encoding='utf-8')
          print('ok' if '.workers.dev/api/product-search' in text else '')
          PY
          )" = "ok"
