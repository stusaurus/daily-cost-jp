name: GSC Tissue Read-Only Forensics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gsc-tissue-forensics.yml'
  pull_request:
    paths:
      - '.github/workflows/gsc-tissue-forensics.yml'
      - 'scripts/gsc_tissue_forensics.py'
      - 'tests/test_gsc_tissue_forensics.py'

permissions:
  contents: read

concurrency:
  group: gsc-tissue-readonly-forensics
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic no-leakage and index-data tests
        run: python3 -m unittest discover -s tests -p 'test_gsc_tissue_forensics.py'

  read-only-investigation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ga4-readonly-pilot
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WIF_PROVIDER: 'projects/557507311026/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
      GCP_SERVICE_ACCOUNT: 'daily-cost-ga4-reader@daily-cost-analytics.iam.gserviceaccount.com'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify report guards before Google authentication
        run: python3 -m unittest discover -s tests -p 'test_gsc_tissue_forensics.py'
      - name: Authenticate Google via main-only short-lived OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install readonly authentication client
        run: python -m pip install 'google-auth[requests]>=2,<3'
      - name: Inspect tissue search before and after September 27
        run: |
          python scripts/gsc_tissue_forensics.py
          cat audit-results/gsc-tissue-forensics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save aggregate-only results for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-tissue-sept27-readonly
          path: |
            audit-results/gsc-tissue-forensics.json
            audit-results/gsc-tissue-forensics.md
          if-no-files-found: warn
          retention-days: 30
