name: GA4 Three-Day Read-Only Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ga4-three-day-analysis.yml'
  schedule:
    # 10:27 JST each day; a date gate below allows the authenticated run every 3 days.
    - cron: '27 1 * * *'
  pull_request:
    paths:
      - 'scripts/ga4_three_day_report.py'
      - 'tests/test_ga4_three_day_report.py'
      - 'scripts/ga4_page_diagnostics.py'
      - 'tests/test_ga4_page_diagnostics.py'
      - 'scripts/gsc_readonly_pilot.py'
      - 'tests/test_gsc_readonly_pilot.py'
      - 'scripts/gsc_daily_search.py'
      - 'tests/test_gsc_daily_search.py'
      - 'scripts/search_affiliate_joint_report.py'
      - 'scripts/autonomous_operations_triage.py'
      - 'tests/test_autonomous_operations_triage.py'
      - 'scripts/autonomous_operations_issue.py'
      - 'tests/test_search_affiliate_joint_report.py'
      - 'scripts/ga4_live_cta_audit.cjs'
      - 'tests/ga4_live_cta_audit.test.cjs'
      - '.github/workflows/ga4-three-day-analysis.yml'

permissions:
  contents: read

concurrency:
  group: ga4-three-day-readonly
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline analysis
        run: |
          python3 -m unittest discover -s tests -p 'test_ga4_three_day_report.py'
          python3 -m unittest discover -s tests -p 'test_ga4_page_diagnostics.py'
          python3 -m unittest discover -s tests -p 'test_gsc_readonly_pilot.py'
          python3 -m unittest discover -s tests -p 'test_gsc_daily_search.py'
          python3 -m unittest discover -s tests -p 'test_search_affiliate_joint_report.py'
          python3 -m unittest discover -s tests -p 'test_autonomous_operations_triage.py'
          node --test tests/ga4_live_cta_audit.test.cjs


  pr-browser-qa:
    name: Verify new browser QA against production (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright without running project scripts
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Inspect existing categories without affiliate clicks or GA4 access
        run: node scripts/ga4_live_cta_audit.cjs --extra-category /categories/bath-cleaner/
      - name: Save independent, reviewable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-live-cta-qa
          path: audit-results/live-cta-qa/
          if-no-files-found: warn
          retention-days: 7
      - name: Add Japanese summary to PR checks
        if: always()
        run: |
          if [ -f audit-results/live-cta-qa/report.md ]; then
            cat audit-results/live-cta-qa/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  cadence:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Choose 3-day JST reporting cadence
        id: check
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          today = dt.datetime.now(ZoneInfo("Asia/Tokyo")).date()
          anchor = dt.date(2026, 10, 10)
          due = os.environ["RUN_EVENT"] in ("workflow_dispatch", "push") or (today - anchor).days % 3 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"due={str(due).lower()}\n")
          print(f"GA4 three-day gate for {today}: {'run' if due else 'skip'}")
          PY

  report:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ga4-readonly-pilot
    permissions:
      contents: read
      id-token: write
    env:
      GA4_PROPERTY_ID: '552907444'
      GCP_WIF_PROVIDER: 'projects/557507311026/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
      GCP_SERVICE_ACCOUNT: 'daily-cost-ga4-reader@daily-cost-analytics.iam.gserviceaccount.com'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test report logic without GA4 credentials
        run: |
          python3 -m unittest discover -s tests -p 'test_ga4_three_day_report.py'
          python3 -m unittest discover -s tests -p 'test_ga4_page_diagnostics.py'
          python3 -m unittest discover -s tests -p 'test_gsc_readonly_pilot.py'
          python3 -m unittest discover -s tests -p 'test_gsc_daily_search.py'
          python3 -m unittest discover -s tests -p 'test_search_affiliate_joint_report.py'
          python3 -m unittest discover -s tests -p 'test_autonomous_operations_triage.py'
      - name: Authenticate to Google using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only GA4 clients
        run: python -m pip install 'google-auth[requests]>=2,<3' 'google-analytics-data>=0.18,<1'
      - name: Generate site-specific, test-aware GA4 report
        run: |
          python scripts/ga4_three_day_report.py
          cat audit-results/ga4-three-day-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate 7 and 28 day page investigation candidates
        run: |
          python scripts/ga4_page_diagnostics.py
          cat audit-results/ga4-page-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
      - name: Read-only Search Console export (optional; never block GA4)
        continue-on-error: true
        run: |
          python scripts/gsc_readonly_pilot.py
          if [ -f audit-results/gsc-search-pilot.md ]; then
            cat audit-results/gsc-search-pilot.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Investigate daily search impressions on key categories (read-only)
        continue-on-error: true
        run: |
          if [ -f audit-results/gsc-search-pilot.json ]; then
            python scripts/gsc_daily_search.py
            if [ -f audit-results/gsc-daily-search-change.md ]; then
              cat audit-results/gsc-daily-search-change.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "Search Console日別レポート：未取得。0回と判定しません。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Rank GSC + GA4 page investigation hypotheses
        run: |
          python scripts/search_affiliate_joint_report.py
          cat audit-results/search-affiliate-joint.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-three-day-report
          path: |
            audit-results/ga4-three-day-report.json
            audit-results/ga4-three-day-report.md
            audit-results/ga4-page-diagnostics.json
            audit-results/ga4-page-diagnostics.md
            audit-results/gsc-search-pilot.json
            audit-results/gsc-search-pilot.md
            audit-results/gsc-daily-search-change.json
            audit-results/gsc-daily-search-change.md
            audit-results/search-affiliate-joint.json
            audit-results/search-affiliate-joint.md
          if-no-files-found: warn
          retention-days: 30

  browser-qa:
    name: Read-only production browser CTA audit
    needs: [cadence, report]
    if: needs.cadence.outputs.due == 'true' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Download this run's GA4 page candidates
        uses: actions/download-artifact@v4
        with:
          name: ga4-three-day-report
          path: audit-results
      - name: Verify read-only audit helper logic
        run: node --test tests/ga4_live_cta_audit.test.cjs
      - name: Open production pages without clicking affiliate links
        run: node scripts/ga4_live_cta_audit.cjs --ga4 audit-results/ga4-page-diagnostics.json --joint audit-results/search-affiliate-joint.json
      - name: Show Japanese technical findings
        if: always()
        run: |
          if [ -f audit-results/live-cta-qa/report.md ]; then
            cat audit-results/live-cta-qa/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save desktop/mobile screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-live-cta-qa
          path: audit-results/live-cta-qa/
          if-no-files-found: warn
          retention-days: 14


  operations-priority:
    name: Prioritize operations and maintain one rolling issue (no code writes)
    needs: [cadence, report, browser-qa]
    if: always() && needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline decision and safety guards
        run: python3 -m unittest discover -s tests -p 'test_autonomous_operations_triage.py'
      - name: Download GA4 and GSC observations if available (missing is reportable)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ga4-three-day-report
          path: audit-results
      - name: Download browser observations if available (failure is a finding)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ga4-live-cta-qa
          path: audit-results/live-cta-qa
      - name: Independently check public website availability
        continue-on-error: true
        run: python3 scripts/autonomous_health_audit.py
      - name: Build bounded priority queue from independent evidence
        run: |
          python3 scripts/autonomous_operations_triage.py
          cat audit-results/autonomous-operations.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update only one rolling GitHub issue for material problems
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autonomous_operations_issue.py
      - name: Save decision and source audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-operations-triage
          path: |
            audit-results/autonomous-operations.json
            audit-results/autonomous-operations.md
            audit-results/health.json
          if-no-files-found: warn
          retention-days: 30

  safe-repair-preparation:
    name: Classify and prepare at most one tested Draft PR (never deploy)
    needs: [cadence, operations-priority]
    if: always() && needs.cadence.outputs.due == 'true' && needs.operations-priority.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: autonomous-operations-triage
          path: audit-results
      - name: Install fixed test dependencies without project scripts
        run: |
          python3 -m pip install -r requirements-render.txt
          npm ci --ignore-scripts
      - name: Classify findings and apply only the approved documentation recipe
        run: |
          python3 scripts/autonomous_operations_step2.py prepare
          cat audit-results/step2-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run complete tests on candidate before any PR API write
        run: python3 scripts/check_step2_candidate.py
      - name: Create Draft only after tests; deduplicate including closed PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autonomous_operations_step2.py publish
      - name: Preserve decisions, test receipt and publication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-operations-step2
          path: audit-results/step2-*
          retention-days: 30
