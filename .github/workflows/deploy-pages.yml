name: Build and deploy daily-cost-jp

on:
  workflow_dispatch:
  schedule:
    # 06:00 JST = 21:00 UTC (previous day)
    - cron: "0 21 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/build_site.py"
      - "scripts/build_site_entry.py"
      - "scripts/build_site_final.py"
      - "scripts/build_site_growth.py"
      - "scripts/build_site_decision.py"
      - "scripts/build_site_products.py"
      - "scripts/build_site_products_v2.py"
      - "scripts/build_realtime_products.py"
      - "scripts/enable_realtime_search.py"
      - "scripts/improve_realtime_search_ux.py"
      - "scripts/improve_seo.py"
      - "scripts/improve_category_seo.py"
      - "scripts/sharpen_home_value_prop.py"
      - "scripts/add_exact_store_compare.py"
      - "scripts/add_daily_buy_picks.py"
      - "scripts/build_dynamic_trends_v2.py"
      - "scripts/expand_ranking_detail.py"
      - "scripts/fix_trend_query_links.py"
      - "scripts/improve_trend_labels.py"
      - "scripts/sync_trend_search_chips.py"
      - "scripts/promote_home_ranking.py"
      - "scripts/move_home_ranking_below_tools.py"
      - "scripts/jump_to_rank11.py"
      - "scripts/simplify_product_ranking_cta.py"
      - "scripts/add_trust_faq.py"
      - "scripts/add_trend_conversion_tracking.py"
      - "scripts/add_back_to_top.py"
      - "scripts/add_analytics.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build comparison site and realtime product finder
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/build_realtime_products.py

      - name: Connect product finder to realtime API
        run: python scripts/enable_realtime_search.py

      - name: Switch realtime API endpoint to Cloudflare Worker
        run: |
          sed -i 's#https://daily-cost-api.netlify.app/api/product-search#https://daily-cost-api.kiyo0625puma.workers.dev/api/product-search#g' site/products/index.html

      - name: Improve search-facing SEO metadata
        run: python scripts/improve_seo.py

      - name: Strengthen category SEO pages
        run: python scripts/improve_category_seo.py

      - name: Clarify homepage value proposition
        run: python scripts/sharpen_home_value_prop.py

      - name: Build dynamic Rakuten trend hub
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/build_dynamic_trends_v2.py

      - name: Expand detailed ranking to top 50
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/expand_ranking_detail.py

      - name: Validate dynamic trend search links
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/fix_trend_query_links.py

      - name: Restore descriptive trend labels
        run: python scripts/improve_trend_labels.py

      - name: Sync product search examples to current trends
        run: python scripts/sync_trend_search_chips.py

      - name: Feature realtime ranking on homepage
        run: python scripts/promote_home_ranking.py

      - name: Move homepage ranking below search and checker
        run: python scripts/move_home_ranking_below_tools.py

      - name: Add exact store-vs-Rakuten comparison
        run: python scripts/add_exact_store_compare.py

      - name: Add daily buy picks
        run: python scripts/add_daily_buy_picks.py

      - name: Continue detailed ranking from rank 11
        run: python scripts/jump_to_rank11.py

      - name: Simplify ranking on product search page
        run: python scripts/simplify_product_ranking_cta.py

      - name: Improve realtime product search ordering
        run: python scripts/improve_realtime_search_ux.py

      - name: Add price-method FAQ and trust notes
        run: python scripts/add_trust_faq.py

      - name: Track trend chips through Rakuten clicks
        run: python scripts/add_trend_conversion_tracking.py

      - name: Add back-to-top button to all pages
        run: python scripts/add_back_to_top.py

      - name: Add GA4 tracking to all pages
        env:
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
        run: python scripts/add_analytics.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
