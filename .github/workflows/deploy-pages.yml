name: Build and deploy daily-cost-jp

on:
  workflow_dispatch:
  schedule:
    # 06:00 JST = 21:00 UTC (previous day)
    - cron: "0 21 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/build_site.py"
      - "scripts/build_site_entry.py"
      - "scripts/build_site_final.py"
      - "scripts/build_site_growth.py"
      - "scripts/build_site_decision.py"
      - "scripts/add_analytics.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build differentiated site from Rakuten API
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/build_site_decision.py

      - name: Add GA4 tracking to all pages
        env:
          GA_MEASUREMENT_ID: G-GFVSZ8YDQ5
        run: python scripts/add_analytics.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
