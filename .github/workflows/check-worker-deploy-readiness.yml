name: Check Worker deploy readiness
on:
  pull_request:
    paths:
      - 'cloudflare-api/**'
      - 'tests/fishing-worker-route.test.cjs'
      - '.github/workflows/check-worker-deploy-readiness.yml'
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          python - <<'PY'
          import os
          groups={
            'cloudflare': ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'],
            'rakuten': ['RAKUTEN_APPLICATION_ID','RAKUTEN_ACCESS_KEY','RAKUTEN_AFFILIATE_ID'],
          }
          for name,keys in groups.items():
              ok=all(os.environ.get(k,'').strip() for k in keys)
              print(f'{name}_credentials=' + ('available' if ok else 'missing'))
          PY
