name: Autonomous Health Audit Pilot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
concurrency:
  group: autonomous-health-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only production audit
        run: python3 scripts/autonomous_health_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-health-report
          path: audit-results/health.json
          if-no-files-found: warn
          retention-days: 14
