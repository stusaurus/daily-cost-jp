name: GSC Six-Site Discovery Diagnostics (Read Only)

on:
  workflow_dispatch:
  schedule:
    # Monday 09:45 JST, after the existing six-site aggregate at 09:00.
    - cron: '45 0 * * 1'
  pull_request:
    paths:
      - 'scripts/gsc_six_sites_diagnostics.py'
      - 'scripts/gsc_six_sites.py'
      - 'tests/test_gsc_six_sites_diagnostics.py'
      - '.github/workflows/gsc-six-sites-diagnostics.yml'
      - 'docs/gsc-six-sites-diagnostics.md'

permissions:
  contents: read

concurrency:
  group: gsc-six-site-discovery-readonly
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify six-site scope, zero safeguards, query and URL response isolation
        run: python3 -m unittest discover -s tests -p 'test_gsc_six_sites_diagnostics.py' -v

  read-only-diagnostics:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: ga4-readonly-pilot
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WIF_PROVIDER: 'projects/557507311026/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
      GCP_SERVICE_ACCOUNT: 'daily-cost-ga4-reader@daily-cost-analytics.iam.gserviceaccount.com'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only diagnostics offline
        run: python3 -m unittest discover -s tests -p 'test_gsc_six_sites_diagnostics.py' -v
      - name: Authenticate through existing short-lived OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - name: Install read-only Google authentication library
        run: python -m pip install 'google-auth[requests]>=2,<3'
      - name: Read keyword, daily and Google index snapshot signals
        run: python -m scripts.gsc_six_sites_diagnostics
      - name: Summarize verified evidence and missing data
        if: always()
        run: |
          if [ -f audit-results/gsc-six-sites-diagnostics.md ]; then
            cat audit-results/gsc-six-sites-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No verified GSC diagnostic data (not equal to zero traffic).' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save diagnostic evidence (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-six-sites-discovery-readonly
          path: |
            audit-results/gsc-six-sites-diagnostics.json
            audit-results/gsc-six-sites-diagnostics.md
          if-no-files-found: warn
          retention-days: 30
      - name: Record failed read-only collection explicitly
        if: failure()
        run: |
          echo '::error::GSC collection failed. Review authentication, API and artifact steps; missing results are not zero traffic.'
          echo '**FAILED: GSC collection or evidence storage did not complete.**' >> "$GITHUB_STEP_SUMMARY"
