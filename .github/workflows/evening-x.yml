name: Publish evening X spotlight

on:
  workflow_dispatch:
  schedule:
    # 19:30 JST = 10:30 UTC
    - cron: "30 10 * * *"

permissions:
  contents: read

jobs:
  post_evening_x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish evening spotlight to X via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_NAME: nichiyo_cost
        run: python scripts/post_buffer_evening.py
