name: Verify a published Yahoo affiliate redirect
on:
  push:
    branches: [qa/yahoo-affiliate-redirect-20261125]

permissions:
  contents: read

jobs:
  public-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check one public redirect without a purchase
        run: |
          node - <<'JS'
          const { chromium } = require('playwright');
          const category = 'https://stusaurus.github.io/daily-cost-jp/categories/softener/?test=1';
          const allowed = host => ['stusaurus.github.io', 'app.yahoo.co.jp', 'a.imgvc.com'].includes(host) ||
            /(^|\.)(shopping\.yahoo\.co\.jp|lohaco\.yahoo\.co\.jp|valuecommerce\.com|valuecommerce\.ne\.jp)$/.test(host);
          (async () => {
            const browser = await chromium.launch();
            try {
              const context = await browser.newContext();
              await context.route('**/*', route => {
                const request = route.request();
                const u = new URL(request.url());
                const clickPost = request.method() === 'POST' && /\.valuecommerce\.(com|ne\.jp)$/.test(u.hostname);
                if (u.protocol === 'https:' && allowed(u.hostname) &&
                    (request.method() === 'GET' || request.method() === 'HEAD' || clickPost)) return route.continue();
                return route.abort();
              });
              const page = await context.newPage();
              await page.goto(category, {waitUntil:'domcontentloaded', timeout:25000});
              const link = page.locator('#marketplace-comparison [data-marketplace=yahoo]').first();
              const href = await link.getAttribute('href', {timeout:10000});
              if (!href) throw Error('public comparison link missing');
              const expected = new URL(new URL(href).searchParams.get('vc_url'));
              const target = url => url.hostname === expected.hostname && url.pathname === expected.pathname;
              context.on('response', result => {
                if (result.request().isNavigationRequest()) {
                  const url = new URL(result.url());
                  console.log(JSON.stringify({host: url.hostname, status: result.status(), expectedProduct: target(url)}));
                }
              });
              context.on('requestfailed', request => {
                const u = new URL(request.url());
                if (request.isNavigationRequest() || allowed(u.hostname)) {
                  console.log('request_failed', u.hostname, request.resourceType(), request.failure()?.errorText);
                }
              });
              const landed = context.waitForEvent('response', {
                predicate: result => result.request().isNavigationRequest() && target(new URL(result.url())) && result.ok(),
                timeout: 105000,
              });
              await Promise.all([landed, link.click({timeout:12000})]);
              console.log('Verified one public Yahoo affiliate redirect to the exact product with HTTP 200.');
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.log('Verification stopped:', err.name, err.message.match(/net::[A-Z_0-9]+/)?.[0] || '');
            process.exitCode = 1;
          });
          JS
